codecov:
  require_ci_to_pass: false
ignore:
- api/v1alpha1/zz_generated.deepcopy.go
- e2e-tests/**
- .agents/**
- .claude/**
- .cursor/**
- skills/**
- docs/**
- '*.md'
- '*.toml'
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 85%
comment:
  layout: reach,diff,flags,files,footer
  require_changes: true
